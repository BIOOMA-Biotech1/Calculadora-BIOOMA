<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de ahorro · Industria · BIOOMA</title>
<style>body{margin:0;padding:16px;background:#f2fafc}</style>
</head>
<body>
<!-- ===================== BIOOMA · Calculadora INDUSTRIAL — copiar desde aquí ===================== -->
<div id="biooma-calc-industrial" lang="es">
<style>
/* ==== SHARED CSS START ==== */
#biooma-calc-industrial {
  /* [FILL] BIOOMA palette and typography — taken from sitio-final/src/css/00-base.css; confirm against the final site */
  --bc-navy: #2b2e82;
  --bc-teal: #6fc0c8;
  --bc-teal-d: #4fa9b2;
  --bc-teal-l: #ddf1f3;
  --bc-sky: #4d9fdd;
  --bc-ink: #0e1230;
  --bc-muted: #565b84;
  --bc-ice: #f2fafc;
  --bc-mist: #e3f3f6;
  --bc-card: #fff;
  --bc-font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bc-font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --bc-r-card: 28px;
  --bc-r-field: 16px;
  --bc-r-pill: 99px;
  /* liquid: «sin BIOOMA» turbio y cálido, «con BIOOMA» limpio; el ahorro es agua clara */
  --bc-glass: rgba(221, 241, 243, 0.55);
  --bc-rim: rgba(43, 46, 130, 0.16);
  --bc-saved: #a9e6ec;
  --bc-murky-1: #7a5f2c;
  --bc-murky-2: #66602f;
  --bc-murky-3: #8a6a3a;
  --bc-murky-4: #55522f;
  --bc-murky-5: #6f5534;
  --bc-murky-6: #5e6538;
  --bc-murky-7: #9a6a2a;
  --bc-murky-8: #4f4a32;
  --bc-ease: cubic-bezier(0.45, 0, 0.55, 1);
  display: block;
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 16px 26px;
  border-radius: var(--bc-r-card);
  background: var(--bc-ice);
  color: var(--bc-ink);
  font-family: var(--bc-font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#biooma-calc-industrial *, #biooma-calc-industrial *::before, #biooma-calc-industrial *::after { box-sizing: border-box; }
#biooma-calc-industrial :focus-visible { outline: 2.5px solid var(--bc-teal-d); outline-offset: 2px; }
#biooma-calc-industrial .bc-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; margin: 0 4px 18px; }
#biooma-calc-industrial .bc-kicker { margin: 0 0 6px; color: var(--bc-teal-d); font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
#biooma-calc-industrial .bc-title { margin: 0; font: 600 clamp(26px, 5vw, 38px)/1.1 var(--bc-font-display); color: var(--bc-navy); }
#biooma-calc-industrial .bc-sub { margin: 8px 0 0; max-width: 56ch; color: var(--bc-muted); }
#biooma-calc-industrial .bc-toggles { display: flex; gap: 10px; }
#biooma-calc-industrial .bc-switch, #biooma-calc-industrial .bc-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--bc-r-pill); background: var(--bc-card); box-shadow: inset 0 0 0 1px var(--bc-rim); }
#biooma-calc-industrial .bc-seg { display: flex; border-radius: var(--bc-r-field); }
#biooma-calc-industrial .bc-switch label, #biooma-calc-industrial .bc-seg label { position: relative; flex: 1 1 auto; }
#biooma-calc-industrial .bc-switch input, #biooma-calc-industrial .bc-seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
#biooma-calc-industrial .bc-switch span, #biooma-calc-industrial .bc-seg span { display: flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border-radius: var(--bc-r-pill); color: var(--bc-navy); font-size: 13.5px; font-weight: 650; text-align: center; transition: background-color 240ms var(--bc-ease), color 240ms var(--bc-ease); cursor: pointer; user-select: none; }
#biooma-calc-industrial .bc-seg span { border-radius: 12px; min-height: 40px; }
#biooma-calc-industrial .bc-switch input:checked + span, #biooma-calc-industrial .bc-seg input:checked + span { background: var(--bc-navy); color: #fff; }
#biooma-calc-industrial .bc-switch input:focus-visible + span, #biooma-calc-industrial .bc-seg input:focus-visible + span { outline: 2.5px solid var(--bc-teal-d); outline-offset: 1px; }
@media (hover: hover) and (pointer: fine) {
  #biooma-calc-industrial .bc-switch input:not(:checked) + span:hover, #biooma-calc-industrial .bc-seg input:not(:checked) + span:hover { background: var(--bc-mist); }
}
#biooma-calc-industrial .bc-grid { display: grid; gap: 16px; }
@media (min-width: 900px) { #biooma-calc-industrial .bc-grid { grid-template-columns: minmax(300px, 380px) 1fr; align-items: start; } }
#biooma-calc-industrial .bc-card { min-width: 0; padding: 20px 18px; border-radius: var(--bc-r-card); background: var(--bc-card); box-shadow: 0 10px 40px rgba(43, 46, 130, 0.07); }
#biooma-calc-industrial .bc-h3 { margin: 0 0 14px; color: var(--bc-navy); font-size: 17px; font-weight: 750; }
#biooma-calc-industrial .bc-group { margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--bc-mist); color: var(--bc-navy); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
#biooma-calc-industrial .bc-field { margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
#biooma-calc-industrial .bc-label { display: flex; align-items: center; gap: 6px; margin: 0 0 7px; padding: 0; font-size: 14px; font-weight: 650; }
#biooma-calc-industrial .bc-label label { cursor: pointer; }
#biooma-calc-industrial .bc-tip { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--bc-mist); color: var(--bc-navy); font: 700 12px/1 var(--bc-font); cursor: help; }
#biooma-calc-industrial .bc-tipbox { position: fixed; z-index: 50; max-width: min(280px, calc(100vw - 32px)); padding: 10px 12px; border-radius: 14px; background: var(--bc-ink); color: #fff; font-size: 13px; line-height: 1.4; box-shadow: 0 12px 30px rgba(14, 18, 48, 0.25); opacity: 0; pointer-events: none; transition: opacity 220ms var(--bc-ease); }
#biooma-calc-industrial .bc-tipbox.is-on { opacity: 1; }
#biooma-calc-industrial .bc-range { display: flex; align-items: center; gap: 12px; }
#biooma-calc-industrial .bc-range output { min-width: 64px; padding: 6px 10px; border-radius: var(--bc-r-pill); background: var(--bc-mist); color: var(--bc-navy); font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
#biooma-calc-industrial input[type='range'] { --p: 50%; flex: 1; height: 28px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: pan-y; }
#biooma-calc-industrial input[type='range']::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--bc-teal) var(--p), var(--bc-mist) var(--p)); }
#biooma-calc-industrial input[type='range']::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--bc-teal) var(--p), var(--bc-mist) var(--p)); }
#biooma-calc-industrial input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border: 3px solid #fff; border-radius: 50%; background: var(--bc-navy); box-shadow: 0 2px 8px rgba(43, 46, 130, 0.3); }
#biooma-calc-industrial input[type='range']::-moz-range-thumb { width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; background: var(--bc-navy); box-shadow: 0 2px 8px rgba(43, 46, 130, 0.3); }
#biooma-calc-industrial .bc-input { display: flex; align-items: center; min-height: 46px; padding: 0 14px; border-radius: var(--bc-r-field); background: var(--bc-ice); box-shadow: inset 0 0 0 1px var(--bc-rim); transition: box-shadow 220ms var(--bc-ease); }
#biooma-calc-industrial .bc-input:focus-within { box-shadow: inset 0 0 0 2px var(--bc-teal-d); }
#biooma-calc-industrial .bc-input input, #biooma-calc-industrial .bc-input select { flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--bc-ink); font: 600 16px var(--bc-font); font-variant-numeric: tabular-nums; }
#biooma-calc-industrial .bc-input input:disabled { color: var(--bc-muted); }
#biooma-calc-industrial .bc-input input::placeholder { color: #8a8fb0; font-weight: 500; }
#biooma-calc-industrial .bc-unit { color: var(--bc-muted); font-size: 13px; font-weight: 600; }
#biooma-calc-industrial .bc-unit--pre { margin-right: 6px; }
#biooma-calc-industrial .bc-unit--post { margin-left: 8px; }
#biooma-calc-industrial .bc-check { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px; font-size: 13.5px; cursor: pointer; }
#biooma-calc-industrial .bc-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--bc-navy); }
#biooma-calc-industrial .bc-hint { min-height: 0; margin: 5px 2px 0; color: var(--bc-muted); font-size: 12.5px; }
#biooma-calc-industrial .bc-hint:empty { display: none; }
#biooma-calc-industrial .bc-res-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#biooma-calc-industrial .bc-replay { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--bc-mist); color: var(--bc-navy); cursor: pointer; transition: background-color 220ms var(--bc-ease), transform 160ms var(--bc-ease); }
#biooma-calc-industrial .bc-replay:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) { #biooma-calc-industrial .bc-replay:hover { background: var(--bc-teal-l); } }
#biooma-calc-industrial .bc-hero-label { margin: 0; color: var(--bc-muted); font-size: 14px; font-weight: 650; }
#biooma-calc-industrial .bc-hero { margin: 2px 0 2px; color: var(--bc-navy); font-size: clamp(38px, 8.5vw, 60px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#biooma-calc-industrial .bc-hero-sub { margin: 4px 0 0; color: var(--bc-ink); font-size: 15px; font-weight: 600; }
#biooma-calc-industrial .bc-chip { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: var(--bc-r-pill); background: var(--bc-teal-l); color: var(--bc-navy); font-size: 13.5px; font-weight: 650; }
#biooma-calc-industrial .bc-note { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--bc-r-field); background: var(--bc-mist); color: var(--bc-navy); font-size: 13.5px; }
#biooma-calc-industrial .bc-note:empty { display: none; }
#biooma-calc-industrial .bc-chart { position: relative; margin-top: 22px; }
#biooma-calc-industrial .bc-chart h4 { margin: 0 0 8px; color: var(--bc-navy); font-size: 14.5px; font-weight: 700; }
#biooma-calc-industrial .bc-chart canvas { display: block; width: 100%; border-radius: 18px; touch-action: pan-y; cursor: crosshair; }
#biooma-calc-industrial .bc-chart canvas:focus-visible { outline-offset: 4px; }
#biooma-calc-industrial .bc-ttip { position: absolute; left: 0; top: 0; z-index: 5; display: grid; gap: 2px; min-width: 120px; max-width: 240px; padding: 9px 12px; border-radius: 14px; background: var(--bc-ink); color: #fff; font-size: 12.5px; line-height: 1.35; box-shadow: 0 12px 30px rgba(14, 18, 48, 0.25); opacity: 0; pointer-events: none; transition: opacity 220ms var(--bc-ease); }
#biooma-calc-industrial .bc-ttip.is-on { opacity: 1; }
#biooma-calc-industrial .bc-ttip b { font-size: 13px; }
#biooma-calc-industrial .bc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 2px 0; padding: 0; list-style: none; color: var(--bc-muted); font-size: 12.5px; }
#biooma-calc-industrial .bc-legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 4px; vertical-align: -1px; }
#biooma-calc-industrial .bc-tnote { margin: -4px 2px 8px; color: var(--bc-muted); font-size: 12px; }
#biooma-calc-industrial .bc-tablewrap { overflow-x: auto; }
#biooma-calc-industrial .bc-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
#biooma-calc-industrial .bc-table th, #biooma-calc-industrial .bc-table td { padding: 8px 6px; border-bottom: 1px solid var(--bc-mist); text-align: right; white-space: nowrap; }
#biooma-calc-industrial .bc-table th:first-child, #biooma-calc-industrial .bc-table td:first-child { padding-left: 2px; text-align: left; white-space: normal; }
#biooma-calc-industrial .bc-table thead th { color: var(--bc-muted); font-size: 12px; font-weight: 650; white-space: normal; vertical-align: bottom; }
#biooma-calc-industrial .bc-table .is-total td { color: var(--bc-navy); font-weight: 750; }
#biooma-calc-industrial .bc-table .is-hl td { background: var(--bc-teal-l); }
#biooma-calc-industrial .bc-table .is-sep td { padding-top: 14px; }
@media (max-width: 520px) { /* phones: concept on its own line, the three amounts in columns below it */
  #biooma-calc-industrial .bc-card { padding: 18px 14px; }
  #biooma-calc-industrial .bc-table { font-size: 12px; }
  #biooma-calc-industrial .bc-table tr { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--bc-mist); }
  #biooma-calc-industrial .bc-table th, #biooma-calc-industrial .bc-table td { padding: 3px 2px 7px; border: 0; }
  #biooma-calc-industrial .bc-table td:first-child { grid-column: 1 / -1; padding: 8px 2px 0; font-weight: 600; }
  #biooma-calc-industrial .bc-table thead th:first-child { display: none; }
  #biooma-calc-industrial .bc-table .is-sep td:first-child { padding-top: 16px; }
  #biooma-calc-industrial .bc-table .is-sep td:not(:first-child) { padding-top: 3px; }
}
#biooma-calc-industrial .bc-after { margin-top: 22px; transition: opacity 340ms var(--bc-ease), transform 340ms var(--bc-ease); }
#biooma-calc-industrial.bc-js:not(.is-landed) .bc-after { opacity: 0; transform: translateY(10px); }
#biooma-calc-industrial.bc-static:not(.is-landed) .bc-after { transform: none; }
#biooma-calc-industrial .bc-disclaimer { margin: 0; color: var(--bc-muted); font-size: 12.5px; line-height: 1.5; }
#biooma-calc-industrial .bc-cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin-top: 14px; padding: 0 24px; border-radius: var(--bc-r-pill); background: var(--bc-navy); color: #fff; font-size: 15px; font-weight: 750; text-decoration: none; transition: background-color 220ms var(--bc-ease), transform 160ms var(--bc-ease); }
#biooma-calc-industrial .bc-cta:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { #biooma-calc-industrial .bc-cta:hover { background: #3a3ea0; } }
#biooma-calc-industrial .bc-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* entrada: los campos se asientan antes de que se llenen los vasos */
#biooma-calc-industrial.bc-js .bc-inputs > * { animation: bc-in 320ms var(--bc-ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
#biooma-calc-industrial.bc-static .bc-inputs > * { animation-name: bc-fade; }
#biooma-calc-industrial.bc-static .bc-chart canvas { animation: bc-fade 320ms var(--bc-ease) both; }
@keyframes bc-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes bc-fade { from { opacity: 0; } }
/* ==== SHARED CSS END ==== */
#biooma-calc-industrial .bc-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#biooma-calc-industrial .bc-chip:empty { display: none; }
</style>

<header class="bc-head">
  <div>
    <p class="bc-kicker" data-i18n="kicker"></p>
    <h2 class="bc-title" data-i18n="title"></h2>
    <p class="bc-sub" data-i18n="sub"></p>
  </div>
  <div class="bc-toggles">
    <div class="bc-switch" role="radiogroup" data-i18n-aria="lang">
      <label><input type="radio" name="bci-lang" value="es" checked><span>ES</span></label>
      <label><input type="radio" name="bci-lang" value="en"><span>EN</span></label>
    </div>
    <div class="bc-switch" role="radiogroup" data-i18n-aria="cur">
      <label><input type="radio" name="bci-cur" value="COP" checked><span>COP</span></label>
      <label><input type="radio" name="bci-cur" value="USD"><span>USD</span></label>
    </div>
  </div>
</header>

<div class="bc-grid">
  <form class="bc-card bc-inputs" novalidate>
    <h3 class="bc-h3" data-i18n="inputs"></h3>
    <p class="bc-group" style="--i:1" data-i18n="g_op"></p>
    <div class="bc-field" style="--i:2">
      <div class="bc-label"><label for="bci-sector" data-i18n="sector"></label><button type="button" class="bc-tip" data-tip="sector_tip">i</button></div>
      <div class="bc-input"><select id="bci-sector">
        <option value="food" data-i18n="sec_food"></option>
        <option value="agro" data-i18n="sec_agro"></option>
        <option value="textile" data-i18n="sec_textile"></option>
        <option value="hotel" data-i18n="sec_hotel"></option>
        <option value="other" data-i18n="sec_other"></option>
      </select></div>
    </div>
    <div class="bc-row" style="--i:3">
      <div class="bc-field">
        <div class="bc-label"><label for="bci-flow" data-i18n="flow"></label><button type="button" class="bc-tip" data-tip="flow_tip">i</button></div>
        <div class="bc-input"><input type="text" inputmode="decimal" id="bci-flow" data-num="flow" data-max="flowM3Day" autocomplete="off"><span class="bc-unit bc-unit--post" data-i18n="u_flow"></span></div>
        <p class="bc-hint" data-hint="flow"></p>
      </div>
      <div class="bc-field">
        <div class="bc-label"><label for="bci-days" data-i18n="days"></label><button type="button" class="bc-tip" data-tip="days_tip">i</button></div>
        <div class="bc-input"><input type="text" inputmode="numeric" id="bci-days" data-num="days" data-max="days" autocomplete="off"><span class="bc-unit bc-unit--post" data-i18n="u_days"></span></div>
        <p class="bc-hint" data-hint="days"></p>
      </div>
    </div>

    <p class="bc-group" style="--i:4" data-i18n="g_load"></p>
    <label class="bc-check" style="--i:5"><input type="checkbox" id="bci-unknown"><span data-i18n="unknown"></span></label>
    <div class="bc-row" style="--i:6">
      <div class="bc-field">
        <div class="bc-label"><label for="bci-bod" data-i18n="bod"></label><button type="button" class="bc-tip" data-tip="bod_tip">i</button></div>
        <div class="bc-input"><input type="text" inputmode="decimal" id="bci-bod" data-num="bod" data-max="mgL" autocomplete="off"><span class="bc-unit bc-unit--post">mg/L</span></div>
        <p class="bc-hint" data-hint="bod"></p>
      </div>
      <div class="bc-field">
        <div class="bc-label"><label for="bci-tss" data-i18n="tss"></label><button type="button" class="bc-tip" data-tip="tss_tip">i</button></div>
        <div class="bc-input"><input type="text" inputmode="decimal" id="bci-tss" data-num="tss" data-max="mgL" autocomplete="off"><span class="bc-unit bc-unit--post">mg/L</span></div>
        <p class="bc-hint" data-hint="tss"></p>
      </div>
    </div>

    <p class="bc-group" style="--i:7" data-i18n="g_spend"></p>
    <div class="bc-field" style="--i:8">
      <div class="bc-label"><label for="bci-chemicals" data-i18n="chemicals"></label><button type="button" class="bc-tip" data-tip="chemicals_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bci-chemicals" data-money="chemicals" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="chemicals"></p>
    </div>
    <div class="bc-field" style="--i:9">
      <div class="bc-label"><label for="bci-energy" data-i18n="energy"></label><button type="button" class="bc-tip" data-tip="energy_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bci-energy" data-money="energy" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="energy"></p>
    </div>
    <div class="bc-field" style="--i:10">
      <div class="bc-label"><label for="bci-labor" data-i18n="labor"></label><button type="button" class="bc-tip" data-tip="labor_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bci-labor" data-money="labor" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="labor"></p>
    </div>
    <div class="bc-field" style="--i:11">
      <div class="bc-label"><label for="bci-sludge" data-i18n="sludge"></label><button type="button" class="bc-tip" data-tip="sludge_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bci-sludge" data-money="sludge" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="sludge"></p>
    </div>
    <div class="bc-field" style="--i:12">
      <div class="bc-label"><label for="bci-thirdParty" data-i18n="thirdParty"></label><button type="button" class="bc-tip" data-tip="thirdParty_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bci-thirdParty" data-money="thirdParty" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="thirdParty"></p>
    </div>

/* ==== ENGINE START — liquid engine (same code in both calculators) ==== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); // easeInOutCubic
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return (hash(i) * (1 - u) + hash(i + 1) * u) * 2 - 1; };
const RAF = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : null;
const STATIC = !RAF || CONFIG.motion === 'never' ||

// Eased rise to 1 + os, then a damped oscillator released from rest: 1–2 swings, each smaller and slower.
function fillCurve(t, rise, os) {
  if (t <= 0) return 0;
  if (t < rise) return (1 + os) * ease(t / rise);
  const s = t - rise, a = 3.4, w = 8.4 / (1 + 0.35 * s);
  return 1 + os * Math.exp(-a * s) * (Math.cos(w * s) + (a / w) * Math.sin(w * s));
}

// One animated value: 'fill' / 'drain' tweens for the choreography, a spring for input changes.
class Chan {
  constructor(os = 0.03, z = 0.74) { this.x = 0; this.v = 0; this.to = 0; this.from = 0; this.os = os; this.z = z; this.mode = 'wait'; this.t = 0; this.rise = 1.5; this.eps = 1e-6; }
  set(to) {
    if (!isFinite(to) || to === this.to) return;
    this.from = this.shown(); this.to = to; this.hit = false;
    if (this.mode === 'idle' || (this.mode === 'fill' && this.t > 0)) this.mode = 'spring'; // blend, never restart
  }
  snap() { this.x = this.from = this.to; this.v = 0; this.mode = 'idle'; this.hit = true; }
  play(delay, rise, drain) {
    this.rise = rise; this.t = -delay; this.hit = false;
    if (drain && this.x > this.eps) { this.mode = 'drain'; this.d0 = this.x; this.td = 0; this.dd = drain; }
    else { this.mode = 'fill'; this.x = 0; this.v = 0; this.from = 0; }
  }
  step(dt) {
    const px = this.x;
    if (this.mode === 'drain') {
      this.td += dt; this.x = this.d0 * (1 - ease(Math.min(1, this.td / this.dd)));
      if (this.td >= this.dd) { this.mode = 'fill'; this.x = 0; this.from = 0; this.hit = false; }
    } else if (this.mode === 'fill') {
      this.t += dt;
      if (this.t > this.rise + 1.5) { this.x = this.to; this.mode = 'idle'; }
      else this.x = this.to * fillCurve(this.t, this.rise, this.os);
    } else if (this.mode === 'spring') {
      const w = TAU * 1.05, z = this.z; let n = Math.ceil(dt * 240); const h = dt / n;
      while (n--) { this.v += (-w * w * (this.x - this.to) - 2 * z * w * this.v) * h; this.x += this.v * h; }
      if (Math.abs(this.x - this.to) < this.eps && Math.abs(this.v) < this.eps * 4) this.snap();
      return true;
    } else return false;
    this.v = dt > 0 ? (this.x - px) / dt : 0;
    return true;
  }
  // number shown for this value: follows the liquid until it first reaches the target, then holds it —
  // the liquid may overshoot and settle, the number lands once and never goes backwards
  shown() {
    if (this.mode === 'drain') return this.x;
    if (!this.hit) { const d = this.to - this.from; this.hit = d > 0 ? this.x >= this.to : d < 0 ? this.x <= this.to : true; }
    return this.hit ? this.to : this.x;
  }
}

function pill(c, x, y, w, h) {
  const r = Math.min(w, h) / 2;
  c.beginPath(); c.moveTo(x + r, y);
  c.arc(x + w - r, y + r, r, -Math.PI / 2, 0); c.lineTo(x + w, y + h - r);
  c.arc(x + w - r, y + h - r, r, 0, Math.PI / 2); c.lineTo(x + r, y + h);
  c.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI); c.lineTo(x, y + r);
  c.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5); c.closePath();
}
function band(c, x, w, bot, ys, n, f) { // liquid below the surface scaled to fraction f of its depth
  c.beginPath(); c.moveTo(x - 2, bot + 2);
  for (let i = 0; i <= n; i++) c.lineTo(x + (i / n) * w, bot - (bot - ys[i]) * f);
  c.lineTo(x + w + 2, bot + 2); c.closePath();
}
function edge(c, x, w, bot, ys, n, f) {
  c.beginPath();
  for (let i = 0; i <= n; i++) { const px = x + (i / n) * w, py = bot - (bot - ys[i]) * f; i ? c.lineTo(px, py) : c.moveTo(px, py); }
}
const fitFont = (c, text, weight, size, maxW, font) => { let s = size; do { c.font = `${weight} ${s}px ${font}`; } while (c.measureText(text).width > maxW && --s > 9); };

// A pill-shaped vessel holding stacked liquid segments (bottom → top). Segments with clear:true are saved water.
class Vessel {
  constructor(segs, dir, name) {

// Shared bits of a chart canvas: size (DPR capped at 2), tooltip, pointer and keyboard.
class Chart {
  constructor(cv, o) {
    this.cv = cv; this.ctx = cv.getContext('2d'); this.o = o; this.tip = cv.parentNode.querySelector('.bc-ttip');
    this.W = this.H = 0; this.cur = -1; this.kb = -1;
    const at = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointermove', e => { const [px, py] = at(e); this.point(px, py, e.buttons > 0); });
    cv.addEventListener('pointerdown', e => { const [px, py] = at(e); this.point(px, py, true, true); clearTimeout(this.tt); });
    cv.addEventListener('pointerup', e => { this.release(); if (e.pointerType !== 'mouse') this.later(); });
    cv.addEventListener('pointercancel', () => { this.release(); this.hide(); });
    cv.addEventListener('pointerleave', e => { this.release(); this.cur = -1; if (e.pointerType === 'mouse') this.hide(); });
    cv.addEventListener('focus', () => this.key(0));
    cv.addEventListener('blur', () => { this.kb = -1; this.hide(); });
    cv.addEventListener('keydown', e => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;

    });

    const w = this.cv.clientWidth, h = this.cv.clientHeight, d = Math.min(2, window.devicePixelRatio || 1);

    this.cv.width = Math.round(w * d); this.cv.height = Math.round(h * d); this.ctx.setTransform(d, 0, 0, d, 0, 0);
    this.W = w; this.H = h; this.d = d; this.layout();
  }
  show(html, px, py) {
    this.tip.innerHTML = html;
    const tw = this.tip.offsetWidth, th = this.tip.offsetHeight;
    const l = clamp(px - tw / 2, 0, this.W - tw), t = py - th - 14 < 0 ? py + 18 : py - th - 14;

  }
  hide() { this.tip.classList.remove('is-on'); }

}

    if (this.cur > 0) { c.strokeStyle = C.rim; c.lineWidth = 1; c.beginPath(); c.moveTo(X(this.cur) + 0.5, Tp); c.lineTo(X(this.cur) + 0.5, Tp + ph); c.stroke(); }
  }
  point(px, py, drag, tap) {
    const { L, pw } = this.geo(), yr = Math.round(clamp((px - L) / pw, 0, 1) * this.o.years);
    if (yr !== this.cur || tap) { this.cur = yr; this.Ek = Math.max(this.Ek, tap ? 1 : 0.7); }
    if (yr < 1) return this.hide();
    this.tipAt(yr, px, py);
  }
  tipAt(yr, px, py) {
    const tr = this.o.tr, f = this.o.fmt, a = this.a.to * yr, b = this.b.to * yr;
    this.show(`<b>${tr('cum')(yr)}</b><span>${tr('without')}: ${f(a)}</span><span>${tr('with')}: ${f(b)}</span><span>${tr('saved')}: ${f(Math.max(0, a - b))}</span>`, px, py);
    this.o.wake();
  }
  key(d, tap) {
    const N = this.o.years; this.kb = this.kb < 1 ? N : ((this.kb - 1 + d + N) % N) + 1; this.cur = this.kb; this.Ek = Math.max(this.Ek, tap ? 1 : 0.6);
    const { L, Tp, pw, ph } = this.geo(); this.tipAt(this.kb, L + (this.kb / N) * pw, Tp + ph / 2);
  }
  hide() { this.cur = -1; super.hide(); }
}

// One requestAnimationFrame loop for every chart; paused off-screen and in hidden tabs.
function makeLoop(charts, onFrame) {
  let on = false, last = 0, T = 0, inView = true;
  const tick = now => {
    if (!inView || document.hidden) { on = false; return; }
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; T += dt; // delta time; long gaps are clamped
    for (const ch of charts) { ch.fit(); ch.step(dt, T); ch.draw(T); }
    onFrame();
    RAF(tick);
  };
  const wake = () => { if (on || STATIC || !inView || document.hidden) return; on = true; last = performance.now(); RAF(tick); };
  const drawStatic = () => { for (const ch of charts) { ch.fit(); ch.step(0, T); ch.draw(T); } onFrame(); };
  if (window.IntersectionObserver) new IntersectionObserver(es => { inView = es[0].isIntersecting; wake(); }).observe(root);
  document.addEventListener('visibilitychange', wake);
  return { wake, drawStatic };
}
const cssVar = n => getComputedStyle(root).getPropertyValue(n).trim();
const rgb = hex => { const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex) || [0, '80', '80', '80']; return [1, 2, 3].map(i => parseInt(m[i], 16)); };
function colors() {
  const C = { font: getComputedStyle(root).fontFamily, ink: cssVar('--bc-ink'), muted: cssVar('--bc-muted'), navy: cssVar('--bc-navy'), teal: cssVar('--bc-teal'), sky: cssVar('--bc-sky'), glass: cssVar('--bc-glass'), rim: cssVar('--bc-rim'), saved: cssVar('--bc-saved'), murky: cssVar('--bc-murky-1'), grid: 'rgba(43,46,130,0.08)' };
  C.murkyRGB = rgb(C.murky); C.savedRGB = rgb(C.saved);
  return C;
}
/* ==== ENGINE END ==== */

/* ============================== Calculation (runs immediately, never waits on animation) ============================== */
const OPS = ['chemicals', 'energy', 'labor', 'sludge', 'thirdParty'];
const CATS = [...OPS, 'corrective', 'tr', 'fines'];
const fin = v => (isFinite(v) && v > 0 ? v : 0);
function compute(s) {
  const sec = CONFIG.sectors[s.sector], TR = CONFIG.tasaRetributiva, r = CONFIG.reduction;
  const flow = fin(s.flow), days = s.days ?? CONFIG.defaults.daysPerYear, m3 = flow * days;
  const bod = s.unknown || s.bod == null ? sec.bodMgL : s.bod, tss = s.unknown || s.tss == null ? sec.tssMgL : s.tss;
  const kgBod = (flow * bod * days) / 1000, kgTss = (flow * tss * days) / 1000; // m³/día × mg/L (= g/m³) × días → g → kg
  const estBod = TR.minRateBodCopPerKg * TR.regionalFactor * kgBod, estTss = TR.minRateTssCopPerKg * TR.regionalFactor * kgTss;
  let trBod = estBod, trTss = estTss;
  if (s.trPaid != null) { // a known payment is split between BOD₅ and TSS in the same proportion as the estimate
    const share = estBod + estTss > 0 ? estBod / (estBod + estTss) : TR.bodShareIfNoEstimate;
    trBod = s.trPaid * share; trTss = s.trPaid - trBod;
  }
  const cat = (k, now, red, est) => ({ k, now: fin(now), with: fin(now * (1 - red)), est });
  const cats = OPS.map(k => cat(k, s[k] != null ? s[k] * 12 : CONFIG.opexCopPerM3[k] * m3, r[k], s[k] == null && CONFIG.opexCopPerM3[k] > 0));
  cats.push(cat('corrective', CONFIG.opexCopPerM3.corrective * m3, r.corrective, true));
  cats.push({ k: 'tr', now: fin(trBod + trTss), with: fin(trBod * (1 - r.bod) + trTss * (1 - r.tss)), est: s.trPaid == null });
  cats.push(cat('fines', (s.fines || 0) * CONFIG.finePerEventCop, r.fines, false));
  const empty = flow <= 0;
  const fee = empty ? 0 : fin(CONFIG.program.baseAnnualCop + CONFIG.program.perM3Cop * m3);
  const without = cats.reduce((a, c) => a + c.now, 0), withB = cats.reduce((a, c) => a + c.with, 0) + fee;
  const trCat = cats[CATS.indexOf('tr')];
  return { cats, fee, without, with: withB, savings: without - withB, trSav: trCat.now - trCat.with, trEst: estBod + estTss, kgBod, kgTss, m3, empty };
}

/* ============================== UI ============================== */
const D = CONFIG.defaults;
const S = { lang: CONFIG.lang, cur: CONFIG.currency, sector: D.sector, flow: D.flowM3Day, days: D.daysPerYear, unknown: D.unknownLoad, bod: null, tss: null,
  chemicals: null, energy: null, labor: null, sludge: null, thirdParty: null, trPaid: null, fines: null };
const $ = s => root.querySelector(s), $$ = s => Array.from(root.querySelectorAll(s));
const tr = k => TXT[S.lang][k] ?? k;
const nfs = {};
function num(v, compact, dec) {
  const key = S.lang + (compact ? 'c' : '') + (dec ? 'd' : '');
  if (!nfs[key]) {
    const loc = S.lang === 'es' ? 'es-CO' : 'en-US';
    try { nfs[key] = new Intl.NumberFormat(loc, compact ? { notation: 'compact', maximumFractionDigits: 1 } : { maximumFractionDigits: dec ? 2 : 0 }); }
    catch (e) { nfs[key] = new Intl.NumberFormat(loc, { maximumFractionDigits: 0 }); }
  }
  return nfs[key].format(v);
}
const rate = () => (S.cur === 'USD' ? CONFIG.copPerUsd : 1);
const money = (cop, compact) => { const v = cop / rate(); return (v < -0.5 ? '−' : '') + '$' + num(Math.abs(compact ? v : Math.round(v)), compact) + (compact ? '' : ' ' + S.cur); };
function parseNum(str) { // digits only (no negatives); a final ",dd" (ES) or ".dd" (EN) is read as decimals
  const s = String(str).replace(/[^\d.,]/g, ''); if (!/\d/.test(s)) return null;
  const i = s.lastIndexOf(S.lang === 'es' ? ',' : '.'), dec = i >= 0 && /^\d{1,2}$/.test(s.slice(i + 1));
  const v = parseFloat((dec ? s.slice(0, i) : s).replace(/\D/g, '') + (dec ? '.' + s.slice(i + 1) : ''));
  return isFinite(v) ? v : null;
}

const C = colors();
const M = [1, 2, 3, 4, 5, 6, 7, 8].map(i => cssVar('--bc-murky-' + i));
const vNow = new Vessel(CATS.map((k, i) => ({ key: k, short: 's_' + k, long: k + '_l', fill: M[i], ink: '#fff', hl: k === 'tr' })), 1, 'now_name');
const vWithout = new Vessel([
  { key: 'ops', short: 's_ops', long: 'ops_l', fill: M[0], ink: '#fff' },
  { key: 'tr', short: 's_trBar', long: 'tr_l', fill: M[6], ink: '#fff' },
], 1, 'without');
const vWith = new Vessel([
  { key: 'cost', short: 's_cost', long: 'cost_l', fill: C.sky, ink: C.ink },
  { key: 'trSaved', short: 's_trSaved', long: 'trSaved_l', clear: true, fill: C.teal },
  { key: 'saved', short: 'saved', long: 'otherSaved_l', clear: true },
], -1, 'with');
const opt = { colors: C, tr, fmt: (v, compact) => money(v, compact), years: CONFIG.years, wake: () => loop.wake() };
const now = new Bars($('[data-chart="now"]'), [vNow], Object.assign({ side: true }, opt));
const bars = new Bars($('[data-chart="bars"]'), [vWithout, vWith], Object.assign({ inside: true }, opt));
const line = new Line($('[data-chart="line"]'), opt);
const out = {}; $$('[data-out]').forEach(el => { out[el.dataset.out] = el; });
let R = compute(S), played = false, liveTimer = 0;
const loop = makeLoop([now, bars, line], () => {
  const sv = vWith.segs[1].c.shown() + vWith.segs[2].c.shown();
  const h = R.empty ? '—' : money(sv), s = R.empty ? '' : tr('inYears')(CONFIG.years, money(sv * CONFIG.years));
  if (out.hero.textContent !== h) out.hero.textContent = h;
  if (out.heroSub.textContent !== s) out.heroSub.textContent = s;
});

function update() {
  R = compute(S);
  const r = R, z = r.empty ? 0 : 1, sav = Math.max(0, r.savings) * z, trPart = Math.min(sav, Math.max(0, r.trSav));
  r.cats.forEach((c, i) => vNow.segs[i].c.set(c.now * z));
  const trNow = r.cats[CATS.indexOf('tr')].now;
  vWithout.segs[0].c.set((r.without - trNow) * z); vWithout.segs[1].c.set(trNow * z);
  vWith.segs[0].c.set(r.with * z); vWith.segs[1].c.set(trPart); vWith.segs[2].c.set(sav - trPart);
  now.setScale(r.without * z * 1.04);
  bars.setScale(Math.max(r.without, r.with) * z * 1.06);
  line.set(r.without * z, r.with * z);
  renderText();
  if (STATIC) settle(); else loop.wake();
}
function settle() { // reduced motion: final state, no waves, bubbles or sloshing
  for (const v of [vNow, vWithout, vWith]) for (const g of v.segs) g.c.snap();
  for (const ch of [line.a, line.b, line.ym, line.rev, line.cla, now.scale, bars.scale]) ch.snap();
  loop.drawStatic();
}
function renderText() {
  const r = R, N = CONFIG.years, cell = v => money(v).replace(' ' + S.cur, '').replace('$', ''); // currency is named in the note
  const row = (label, a, b, cls = '') => `<tr role="row" class="${cls}"><td role="rowheader">${label}</td><td role="cell">${cell(a)}</td><td role="cell">${cell(b)}</td><td role="cell">${cell(a - b)}</td></tr>`;
  let h = '';
  if (!r.empty) {
    h = r.cats.filter(c => c.now > 0).map(c => row(tr(c.k + '_l') + (c.est ? ' *' : ''), c.now, c.with, c.k === 'tr' ? 'is-hl' : '')).join('') +
      row(tr('fee'), 0, r.fee) + row(tr('annualCost'), r.without, r.with, 'is-total');
    for (let y = 1; y <= N; y++) h += row(tr('cum')(y), r.without * y, r.with * y, (y === 1 ? 'is-sep ' : '') + (y === N ? 'is-total' : ''));
  }
  out.table.innerHTML = h;
  out.tableNote.textContent = tr('tableNote')(S.cur, num(Math.round(r.kgBod)), num(Math.round(r.kgTss)));
  out.note.textContent = r.empty ? tr('empty') : r.savings <= 0 ? tr('noSaving') : '';
  out.chip.textContent = !r.empty && r.trSav > 0 ? tr('trChip')(money(r.trSav)) : '';
  now.cv.setAttribute('aria-label', tr('ariaNow')(money(r.without)));
  bars.cv.setAttribute('aria-label', tr('ariaBars')(money(r.without), money(r.with)));
  line.cv.setAttribute('aria-label', tr('ariaLine')(N, money(r.without * N), money(r.with * N)));
  clearTimeout(liveTimer); // announce once the user stops changing inputs
  liveTimer = setTimeout(() => { const sv = r.empty ? 0 : Math.max(0, r.savings); out.live.textContent = r.empty ? tr('empty') : tr('live')(money(sv), N, money(sv * N)); }, 700);
  // inputs: values in the chosen currency/locale, estimates as placeholders
  const sec = CONFIG.sectors[S.sector];
  $$('[data-money]').forEach(inp => {
    const k = inp.dataset.money, est = k === 'trPaid' ? r.trEst : (CONFIG.opexCopPerM3[k] * r.m3) / 12;
    inp.placeholder = est > 0 ? '≈ ' + num(Math.round(est / rate())) : '0';
    if (document.activeElement !== inp) inp.value = S[k] == null ? '' : num(Math.round(S[k] / rate()));
  });
  $$('[data-num]').forEach(inp => {
    const k = inp.dataset.num, load = k === 'bod' || k === 'tss';
    if (load) { inp.disabled = S.unknown; inp.placeholder = num(k === 'bod' ? sec.bodMgL : sec.tssMgL); }
    if (k === 'days') inp.placeholder = num(CONFIG.defaults.daysPerYear);
    if (document.activeElement !== inp) inp.value = S[k] == null || (load && S.unknown) ? '' : num(S[k], false, true);
  });
  $$('[data-cur]').forEach(el => { el.textContent = S.cur; });
}
function applyLang() {
  root.lang = S.lang;
  $$('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.i18nAria)));
  $$('.bc-tip').forEach(b => b.setAttribute('aria-label', tr('tipAria')));
  const t = CONFIG.ctaText[S.lang];
  out.cta.href = CONFIG.ctaUrl + (t && /wa\.me/.test(CONFIG.ctaUrl) ? (CONFIG.ctaUrl.includes('?') ? '&' : '?') + 'text=' + encodeURIComponent(t) : '');
}
function ripple() { for (const v of [vNow, vWithout, vWith]) v.kick(0.5, v.w / 2); line.Ek = Math.max(line.Ek, 0.5); }
function play(replay) {
  if (STATIC) { root.classList.add('is-landed'); return settle(); }
  const d = replay ? 0.5 : 0, t0 = 0.2 + rnd(0, 0.04), t1 = t0 + 1.15; // bars start when the breakdown is ~75 % full
  vNow.play(t0, rnd(1.45, 1.65), d, 0);
  vWithout.play(t1 + rnd(0, 0.04), rnd(1.45, 1.7), d, 0);
  vWith.play(t1 + rnd(0.08, 0.16), rnd(1.45, 1.7), d, 1.05);
  line.play(t1 + 1.3, d);
  setTimeout(() => root.classList.add('is-landed'), (d + t1 + 2.1) * 1000);
  loop.wake();
}

// inputs
const sector = $('#bci-sector'), unknown = $('#bci-unknown');
sector.value = S.sector; unknown.checked = S.unknown;
sector.addEventListener('change', () => { S.sector = sector.value; update(); });
unknown.addEventListener('change', () => { S.unknown = unknown.checked; update(); });
$$('[data-num]').forEach(inp => {
  const k = inp.dataset.num, max = CONFIG.limits[inp.dataset.max], hint = $(`[data-hint="${k}"]`);
  inp.addEventListener('input', () => {
    let v = parseNum(inp.value);
    hint.textContent = v != null && v > max ? tr('max')(num(max)) : '';
    if (v != null) v = Math.min(v, max);
    if (v != null && (k === 'days' || k === 'fines')) v = Math.round(v);
    if (k === 'days' && v === 0) v = null; // zero days is not a real input: fall back to the default
    S[k] = v; update();
  });
  inp.addEventListener('blur', () => renderText());
});
$$('[data-money]').forEach(inp => {
  const k = inp.dataset.money, hint = $(`[data-hint="${k}"]`), max = CONFIG.limits.moneyMaxCop;
  inp.addEventListener('input', () => {
    const v = parseNum(inp.value);
    hint.textContent = v != null && v * rate() > max ? tr('max')(money(max)) : '';
    S[k] = v == null ? null : Math.min(v * rate(), max);
    update();
  });
  inp.addEventListener('blur', () => renderText());
});
for (const name of ['lang', 'cur']) {
  $$(`[name="bci-${name}"]`).forEach(el => {
    el.checked = el.value === S[name];
    el.addEventListener('change', () => { S[name] = el.value; $$('[data-hint]').forEach(h => { h.textContent = ''; }); applyLang(); renderText(); ripple(); if (STATIC) settle(); else loop.wake(); });
  });
}
root.querySelector('form').addEventListener('submit', e => e.preventDefault());
$('[data-act="replay"]').addEventListener('click', () => { if (played) play(true); });

// field tooltips (hover, focus or tap)
const tipbox = $('#bci-tipbox');
let tipOwner = null;
const tipShow = b => {
  tipOwner = b; tipbox.textContent = tr(b.dataset.tip); b.setAttribute('aria-describedby', tipbox.id);
  const r = b.getBoundingClientRect(), w = tipbox.offsetWidth;
  tipbox.style.left = clamp(r.left + r.width / 2 - w / 2, 16, window.innerWidth - w - 16) + 'px';
  tipbox.style.top = r.bottom + 8 + 'px'; tipbox.classList.add('is-on');
};
const tipHide = () => { if (tipOwner) tipOwner.removeAttribute('aria-describedby'); tipOwner = null; tipbox.classList.remove('is-on'); };
$$('.bc-tip').forEach(b => {
  b.addEventListener('mouseenter', () => tipShow(b)); b.addEventListener('mouseleave', tipHide);
  b.addEventListener('focus', () => tipShow(b)); b.addEventListener('blur', tipHide);
  b.addEventListener('click', () => (tipOwner === b && tipbox.classList.contains('is-on') ? tipHide() : tipShow(b)));
});
root.addEventListener('keydown', e => { if (e.key === 'Escape') tipHide(); });
window.addEventListener('scroll', tipHide, { passive: true });

root.classList.add('bc-js');
if (STATIC) root.classList.add('bc-static');
applyLang();
update();
const start = () => { if (!played) { played = true; play(false); } };
if (window.IntersectionObserver) {
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); start(); } }, { threshold: 0.15 });
  io.observe($('.bc-results'));
} else start();
if (window.ResizeObserver) new ResizeObserver(() => { if (STATIC) loop.drawStatic(); else loop.wake(); }).observe(root);
else window.addEventListener('resize', () => (STATIC ? loop.drawStatic() : loop.wake()));
})();
</script>
