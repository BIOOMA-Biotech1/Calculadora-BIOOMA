<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de ahorro · Hogar · BIOOMA</title>
<style>body{margin:0;padding:16px;background:#f2fafc}</style>
</head>
<body>
<!-- ===================== BIOOMA · Calculadora HOGAR — copiar desde aquí ===================== -->
<div id="biooma-calc-hogar" lang="es">
<style>
/* ==== SHARED CSS START ==== */
#biooma-calc-hogar {
  /* [FILL] BIOOMA palette and typography — taken from sitio-final/src/css/00-base.css; confirm against the final site */
  --bc-navy: #2b2e82;
  --bc-teal: #6fc0c8;
  --bc-teal-d: #4fa9b2;
  --bc-teal-l: #ddf1f3;
  --bc-sky: #4d9fdd;
  --bc-ink: #0e1230;
  --bc-muted: #565b84;
  --bc-ice: #f2fafc;
  --bc-mist: #e3f3f6;
  --bc-card: #fff;
  --bc-font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --bc-font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --bc-r-card: 28px;
  --bc-r-field: 16px;
  --bc-r-pill: 99px;
  /* liquid: «sin BIOOMA» turbio y cálido, «con BIOOMA» limpio; el ahorro es agua clara */
  --bc-glass: rgba(221, 241, 243, 0.55);
  --bc-rim: rgba(43, 46, 130, 0.16);
  --bc-saved: #a9e6ec;
  --bc-murky-1: #7a5f2c;
  --bc-murky-2: #66602f;
  --bc-murky-3: #8a6a3a;
  --bc-murky-4: #55522f;
  --bc-murky-5: #6f5534;
  --bc-murky-6: #5e6538;
  --bc-murky-7: #9a6a2a;
  --bc-murky-8: #4f4a32;
  --bc-ease: cubic-bezier(0.45, 0, 0.55, 1);
  display: block;
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 16px 26px;
  border-radius: var(--bc-r-card);
  background: var(--bc-ice);
  color: var(--bc-ink);
  font-family: var(--bc-font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#biooma-calc-hogar *, #biooma-calc-hogar *::before, #biooma-calc-hogar *::after { box-sizing: border-box; }
#biooma-calc-hogar :focus-visible { outline: 2.5px solid var(--bc-teal-d); outline-offset: 2px; }
#biooma-calc-hogar .bc-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; margin: 0 4px 18px; }
#biooma-calc-hogar .bc-kicker { margin: 0 0 6px; color: var(--bc-teal-d); font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
#biooma-calc-hogar .bc-title { margin: 0; font: 600 clamp(26px, 5vw, 38px)/1.1 var(--bc-font-display); color: var(--bc-navy); }
#biooma-calc-hogar .bc-sub { margin: 8px 0 0; max-width: 56ch; color: var(--bc-muted); }
#biooma-calc-hogar .bc-toggles { display: flex; gap: 10px; }
#biooma-calc-hogar .bc-switch, #biooma-calc-hogar .bc-seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--bc-r-pill); background: var(--bc-card); box-shadow: inset 0 0 0 1px var(--bc-rim); }
#biooma-calc-hogar .bc-seg { display: flex; border-radius: var(--bc-r-field); }
#biooma-calc-hogar .bc-switch label, #biooma-calc-hogar .bc-seg label { position: relative; flex: 1 1 auto; }
#biooma-calc-hogar .bc-switch input, #biooma-calc-hogar .bc-seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
#biooma-calc-hogar .bc-switch span, #biooma-calc-hogar .bc-seg span { display: flex; align-items: center; justify-content: center; min-height: 36px; padding: 0 14px; border-radius: var(--bc-r-pill); color: var(--bc-navy); font-size: 13.5px; font-weight: 650; text-align: center; transition: background-color 240ms var(--bc-ease), color 240ms var(--bc-ease); cursor: pointer; user-select: none; }
#biooma-calc-hogar .bc-seg span { border-radius: 12px; min-height: 40px; }
#biooma-calc-hogar .bc-switch input:checked + span, #biooma-calc-hogar .bc-seg input:checked + span { background: var(--bc-navy); color: #fff; }
#biooma-calc-hogar .bc-switch input:focus-visible + span, #biooma-calc-hogar .bc-seg input:focus-visible + span { outline: 2.5px solid var(--bc-teal-d); outline-offset: 1px; }
@media (hover: hover) and (pointer: fine) {
  #biooma-calc-hogar .bc-switch input:not(:checked) + span:hover, #biooma-calc-hogar .bc-seg input:not(:checked) + span:hover { background: var(--bc-mist); }
}
#biooma-calc-hogar .bc-grid { display: grid; gap: 16px; }
@media (min-width: 900px) { #biooma-calc-hogar .bc-grid { grid-template-columns: minmax(300px, 380px) 1fr; align-items: start; } }
#biooma-calc-hogar .bc-card { min-width: 0; padding: 20px 18px; border-radius: var(--bc-r-card); background: var(--bc-card); box-shadow: 0 10px 40px rgba(43, 46, 130, 0.07); }
#biooma-calc-hogar .bc-h3 { margin: 0 0 14px; color: var(--bc-navy); font-size: 17px; font-weight: 750; }
#biooma-calc-hogar .bc-group { margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--bc-mist); color: var(--bc-navy); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
#biooma-calc-hogar .bc-field { margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
#biooma-calc-hogar .bc-label { display: flex; align-items: center; gap: 6px; margin: 0 0 7px; padding: 0; font-size: 14px; font-weight: 650; }
#biooma-calc-hogar .bc-label label { cursor: pointer; }
#biooma-calc-hogar .bc-tip { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: var(--bc-mist); color: var(--bc-navy); font: 700 12px/1 var(--bc-font); cursor: help; }
#biooma-calc-hogar .bc-tipbox { position: fixed; z-index: 50; max-width: min(280px, calc(100vw - 32px)); padding: 10px 12px; border-radius: 14px; background: var(--bc-ink); color: #fff; font-size: 13px; line-height: 1.4; box-shadow: 0 12px 30px rgba(14, 18, 48, 0.25); opacity: 0; pointer-events: none; transition: opacity 220ms var(--bc-ease); }
#biooma-calc-hogar .bc-tipbox.is-on { opacity: 1; }
#biooma-calc-hogar .bc-range { display: flex; align-items: center; gap: 12px; }
#biooma-calc-hogar .bc-range output { min-width: 64px; padding: 6px 10px; border-radius: var(--bc-r-pill); background: var(--bc-mist); color: var(--bc-navy); font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
#biooma-calc-hogar input[type='range'] { --p: 50%; flex: 1; height: 28px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; touch-action: pan-y; }
#biooma-calc-hogar input[type='range']::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--bc-teal) var(--p), var(--bc-mist) var(--p)); }
#biooma-calc-hogar input[type='range']::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--bc-teal) var(--p), var(--bc-mist) var(--p)); }
#biooma-calc-hogar input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -8px; border: 3px solid #fff; border-radius: 50%; background: var(--bc-navy); box-shadow: 0 2px 8px rgba(43, 46, 130, 0.3); }
#biooma-calc-hogar input[type='range']::-moz-range-thumb { width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; background: var(--bc-navy); box-shadow: 0 2px 8px rgba(43, 46, 130, 0.3); }
#biooma-calc-hogar .bc-input { display: flex; align-items: center; min-height: 46px; padding: 0 14px; border-radius: var(--bc-r-field); background: var(--bc-ice); box-shadow: inset 0 0 0 1px var(--bc-rim); transition: box-shadow 220ms var(--bc-ease); }
#biooma-calc-hogar .bc-input:focus-within { box-shadow: inset 0 0 0 2px var(--bc-teal-d); }
#biooma-calc-hogar .bc-input input, #biooma-calc-hogar .bc-input select { flex: 1; min-width: 0; height: 44px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--bc-ink); font: 600 16px var(--bc-font); font-variant-numeric: tabular-nums; }
#biooma-calc-hogar .bc-input input:disabled { color: var(--bc-muted); }
#biooma-calc-hogar .bc-input input::placeholder { color: #8a8fb0; font-weight: 500; }
#biooma-calc-hogar .bc-unit { color: var(--bc-muted); font-size: 13px; font-weight: 600; }
#biooma-calc-hogar .bc-unit--pre { margin-right: 6px; }
#biooma-calc-hogar .bc-unit--post { margin-left: 8px; }
#biooma-calc-hogar .bc-check { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px; font-size: 13.5px; cursor: pointer; }
#biooma-calc-hogar .bc-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--bc-navy); }
#biooma-calc-hogar .bc-hint { min-height: 0; margin: 5px 2px 0; color: var(--bc-muted); font-size: 12.5px; }
#biooma-calc-hogar .bc-hint:empty { display: none; }
#biooma-calc-hogar .bc-res-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
#biooma-calc-hogar .bc-replay { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--bc-mist); color: var(--bc-navy); cursor: pointer; transition: background-color 220ms var(--bc-ease), transform 160ms var(--bc-ease); }
#biooma-calc-hogar .bc-replay:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) { #biooma-calc-hogar .bc-replay:hover { background: var(--bc-teal-l); } }
#biooma-calc-hogar .bc-hero-label { margin: 0; color: var(--bc-muted); font-size: 14px; font-weight: 650; }
#biooma-calc-hogar .bc-hero { margin: 2px 0 2px; color: var(--bc-navy); font-size: clamp(38px, 8.5vw, 60px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#biooma-calc-hogar .bc-hero-sub { margin: 4px 0 0; color: var(--bc-ink); font-size: 15px; font-weight: 600; }
#biooma-calc-hogar .bc-chip { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: var(--bc-r-pill); background: var(--bc-teal-l); color: var(--bc-navy); font-size: 13.5px; font-weight: 650; }
#biooma-calc-hogar .bc-note { margin: 12px 0 0; padding: 10px 14px; border-radius: var(--bc-r-field); background: var(--bc-mist); color: var(--bc-navy); font-size: 13.5px; }
#biooma-calc-hogar .bc-note:empty { display: none; }
#biooma-calc-hogar .bc-chart { position: relative; margin-top: 22px; }
#biooma-calc-hogar .bc-chart h4 { margin: 0 0 8px; color: var(--bc-navy); font-size: 14.5px; font-weight: 700; }
#biooma-calc-hogar .bc-chart canvas { display: block; width: 100%; border-radius: 18px; touch-action: pan-y; cursor: crosshair; }
#biooma-calc-hogar .bc-chart canvas:focus-visible { outline-offset: 4px; }
#biooma-calc-hogar .bc-ttip { position: absolute; left: 0; top: 0; z-index: 5; display: grid; gap: 2px; min-width: 120px; max-width: 240px; padding: 9px 12px; border-radius: 14px; background: var(--bc-ink); color: #fff; font-size: 12.5px; line-height: 1.35; box-shadow: 0 12px 30px rgba(14, 18, 48, 0.25); opacity: 0; pointer-events: none; transition: opacity 220ms var(--bc-ease); }
#biooma-calc-hogar .bc-ttip.is-on { opacity: 1; }
#biooma-calc-hogar .bc-ttip b { font-size: 13px; }
#biooma-calc-hogar .bc-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 8px 2px 0; padding: 0; list-style: none; color: var(--bc-muted); font-size: 12.5px; }
#biooma-calc-hogar .bc-legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 4px; vertical-align: -1px; }
#biooma-calc-hogar .bc-tnote { margin: -4px 2px 8px; color: var(--bc-muted); font-size: 12px; }
#biooma-calc-hogar .bc-tablewrap { overflow-x: auto; }
#biooma-calc-hogar .bc-table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
#biooma-calc-hogar .bc-table th, #biooma-calc-hogar .bc-table td { padding: 8px 6px; border-bottom: 1px solid var(--bc-mist); text-align: right; white-space: nowrap; }
#biooma-calc-hogar .bc-table th:first-child, #biooma-calc-hogar .bc-table td:first-child { padding-left: 2px; text-align: left; white-space: normal; }
#biooma-calc-hogar .bc-table thead th { color: var(--bc-muted); font-size: 12px; font-weight: 650; white-space: normal; vertical-align: bottom; }
#biooma-calc-hogar .bc-table .is-total td { color: var(--bc-navy); font-weight: 750; }
#biooma-calc-hogar .bc-table .is-hl td { background: var(--bc-teal-l); }
#biooma-calc-hogar .bc-table .is-sep td { padding-top: 14px; }
@media (max-width: 520px) { /* phones: concept on its own line, the three amounts in columns below it */
  #biooma-calc-hogar .bc-card { padding: 18px 14px; }
  #biooma-calc-hogar .bc-table { font-size: 12px; }
  #biooma-calc-hogar .bc-table tr { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--bc-mist); }
  #biooma-calc-hogar .bc-table th, #biooma-calc-hogar .bc-table td { padding: 3px 2px 7px; border: 0; }
  #biooma-calc-hogar .bc-table td:first-child { grid-column: 1 / -1; padding: 8px 2px 0; font-weight: 600; }
  #biooma-calc-hogar .bc-table thead th:first-child { display: none; }
  #biooma-calc-hogar .bc-table .is-sep td:first-child { padding-top: 16px; }
  #biooma-calc-hogar .bc-table .is-sep td:not(:first-child) { padding-top: 3px; }
}
#biooma-calc-hogar .bc-after { margin-top: 22px; transition: opacity 340ms var(--bc-ease), transform 340ms var(--bc-ease); }
#biooma-calc-hogar.bc-js:not(.is-landed) .bc-after { opacity: 0; transform: translateY(10px); }
#biooma-calc-hogar.bc-static:not(.is-landed) .bc-after { transform: none; }
#biooma-calc-hogar .bc-disclaimer { margin: 0; color: var(--bc-muted); font-size: 12.5px; line-height: 1.5; }
#biooma-calc-hogar .bc-cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; margin-top: 14px; padding: 0 24px; border-radius: var(--bc-r-pill); background: var(--bc-navy); color: #fff; font-size: 15px; font-weight: 750; text-decoration: none; transition: background-color 220ms var(--bc-ease), transform 160ms var(--bc-ease); }
#biooma-calc-hogar .bc-cta:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { #biooma-calc-hogar .bc-cta:hover { background: #3a3ea0; } }
#biooma-calc-hogar .bc-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* entrada: los campos se asientan antes de que se llenen los vasos */
#biooma-calc-hogar.bc-js .bc-inputs > * { animation: bc-in 320ms var(--bc-ease) both; animation-delay: calc(var(--i, 0) * 40ms); }
#biooma-calc-hogar.bc-static .bc-inputs > * { animation-name: bc-fade; }
#biooma-calc-hogar.bc-static .bc-chart canvas { animation: bc-fade 320ms var(--bc-ease) both; }
@keyframes bc-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes bc-fade { from { opacity: 0; } }
/* ==== SHARED CSS END ==== */
</style>

<header class="bc-head">
  <div>
    <p class="bc-kicker" data-i18n="kicker"></p>
    <h2 class="bc-title" data-i18n="title"></h2>
    <p class="bc-sub" data-i18n="sub"></p>
  </div>
  <div class="bc-toggles">
    <div class="bc-switch" role="radiogroup" data-i18n-aria="lang">
      <label><input type="radio" name="bch-lang" value="es" checked><span>ES</span></label>
      <label><input type="radio" name="bch-lang" value="en"><span>EN</span></label>
    </div>
    <div class="bc-switch" role="radiogroup" data-i18n-aria="cur">
      <label><input type="radio" name="bch-cur" value="COP" checked><span>COP</span></label>
      <label><input type="radio" name="bch-cur" value="USD"><span>USD</span></label>
    </div>
  </div>
</header>

<div class="bc-grid">
  <form class="bc-card bc-inputs" novalidate>
    <h3 class="bc-h3" data-i18n="inputs"></h3>
    <fieldset class="bc-field" style="--i:1">
      <legend class="bc-label"><span data-i18n="system"></span><button type="button" class="bc-tip" data-tip="system_tip">i</button></legend>
      <div class="bc-seg">
        <label><input type="radio" name="bch-system" value="septic"><span data-i18n="sys_septic"></span></label>
        <label><input type="radio" name="bch-system" value="grease"><span data-i18n="sys_grease"></span></label>
        <label><input type="radio" name="bch-system" value="other"><span data-i18n="sys_other"></span></label>
      </div>
    </fieldset>
    <div class="bc-field" style="--i:2">
      <div class="bc-label"><label for="bch-people" data-i18n="people"></label><button type="button" class="bc-tip" data-tip="people_tip">i</button></div>
      <div class="bc-range"><input type="range" id="bch-people" min="1" step="1"><output id="bch-people-out" for="bch-people"></output></div>
    </div>
    <div class="bc-field" style="--i:3">
      <div class="bc-label"><label for="bch-years" data-i18n="years"></label><button type="button" class="bc-tip" data-tip="years_tip">i</button></div>
      <div class="bc-range"><input type="range" id="bch-years" min="0" step="1"><output id="bch-years-out" for="bch-years"></output></div>
    </div>
    <fieldset class="bc-field" style="--i:4">
      <legend class="bc-label"><span data-i18n="problems"></span><button type="button" class="bc-tip" data-tip="problems_tip">i</button></legend>
      <div class="bc-seg">
        <label><input type="radio" name="bch-problems" value="never"><span data-i18n="prob_never"></span></label>
        <label><input type="radio" name="bch-problems" value="sometimes"><span data-i18n="prob_sometimes"></span></label>
        <label><input type="radio" name="bch-problems" value="often"><span data-i18n="prob_often"></span></label>
      </div>
    </fieldset>
    <div class="bc-field" style="--i:5">
      <div class="bc-label"><label for="bch-cost-extraction" data-i18n="costExtraction"></label><button type="button" class="bc-tip" data-tip="costExtraction_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bch-cost-extraction" data-money="extraction" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="extraction"></p>
    </div>
    <div class="bc-field" style="--i:6">
      <div class="bc-label"><label for="bch-cost-unclog" data-i18n="costUnclog"></label><button type="button" class="bc-tip" data-tip="costUnclog_tip">i</button></div>
      <div class="bc-input"><span class="bc-unit bc-unit--pre">$</span><input type="text" inputmode="decimal" id="bch-cost-unclog" data-money="unclog" autocomplete="off"><span class="bc-unit bc-unit--post" data-cur></span></div>
      <p class="bc-hint" data-hint="unclog"></p>
    </div>
  </form>

  <section class="bc-card bc-results" aria-labelledby="bch-hero-label">
    <div class="bc-res-head">
      <div>
        <p class="bc-hero-label" id="bch-hero-label" data-i18n="headline"></p>
        <p class="bc-hero" aria-hidden="true" data-out="hero"></p>
        <p class="bc-hero-sub" aria-hidden="true" data-out="heroSub"></p>
      </div>
      <button type="button" class="bc-replay" data-act="replay" data-i18n-aria="replay"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    </div>
    <p class="bc-sr" aria-live="polite" data-out="live"></p>
    <p class="bc-note" data-out="note"></p>

    <div class="bc-chart">
      <h4 data-i18n="barsTitle"></h4>
      <canvas data-chart="bars" tabindex="0" role="img" style="height:320px"></canvas>
      <div class="bc-ttip" aria-hidden="true"></div>
    </div>

    <div class="bc-chart">
      <h4 data-i18n="lineTitle"></h4>
      <canvas data-chart="line" tabindex="0" role="img" style="height:240px"></canvas>
      <div class="bc-ttip" aria-hidden="true"></div>
      <ul class="bc-legend">
        <li><i style="background:var(--bc-murky-1)"></i><span data-i18n="without"></span></li>
        <li><i style="background:linear-gradient(var(--bc-teal),var(--bc-navy))"></i><span data-i18n="with"></span></li>
        <li><i style="background:var(--bc-saved)"></i><span data-i18n="cumSaved"></span></li>
      </ul>
    </div>

    <div class="bc-chart">
      <h4 data-i18n="tableTitle"></h4>
      <p class="bc-tnote" data-out="tableNote"></p>
      <div class="bc-tablewrap">
      <table class="bc-table" role="table">
        <caption class="bc-sr" data-i18n="tableTitle"></caption>
        <thead role="rowgroup"><tr role="row"><th role="columnheader" data-i18n="colConcept"></th><th role="columnheader" data-i18n="without"></th><th role="columnheader" data-i18n="with"></th><th role="columnheader" data-i18n="colDiff"></th></tr></thead>
        <tbody role="rowgroup" data-out="table"></tbody>
      </table>
      </div>
    </div>

// Eased rise to 1 + os, then a damped oscillator released from rest: 1–2 swings, each smaller and slower.

function pill(c, x, y, w, h) {

// A pill-shaped vessel holding stacked liquid segments (bottom → top). Segments with clear:true are saved water.

function settle() { // reduced motion: final state, no waves, bubbles or sloshing
  for (const v of [vWithout, vWith]) for (const g of v.segs) g.c.snap();
  for (const ch of [line.a, line.b, line.ym, line.rev, line.cla, bars.scale]) ch.snap();
  loop.drawStatic();
}
function renderText() {
  const r = R, N = CONFIG.years, cell = v => money(v).replace(' ' + S.cur, '').replace('$', ''); // currency is named in the note
  const row = (label, a, b, cls = '') => `<tr role="row" class="${cls}"><td role="rowheader">${label}</td><td role="cell">${cell(a)}</td><td role="cell">${cell(b)}</td><td role="cell">${cell(a - b)}</td></tr>`;
  let h = r.cats.map(c => row(tr(c.k), c.now, c.with)).join('') + row(tr('fee'), 0, r.fee) + row(tr('annualCost'), r.without, r.with, 'is-total');
  for (let y = 1; y <= N; y++) h += row(tr('cum')(y), r.without * y, r.with * y, (y === 1 ? 'is-sep ' : '') + (y === N ? 'is-total' : ''));
  out.table.innerHTML = h;
  out.tableNote.textContent = tr('tableNote')(S.cur);
  out.note.textContent = r.without <= 0 ? tr('empty') : r.savings <= 0 ? tr('noSaving') : '';
  bars.cv.setAttribute('aria-label', tr('ariaBars')(money(r.without), money(r.with)));
  line.cv.setAttribute('aria-label', tr('ariaLine')(N, money(r.without * N), money(r.with * N)));
  clearTimeout(liveTimer); // announce once the user stops changing inputs
  liveTimer = setTimeout(() => { out.live.textContent = tr('live')(money(Math.max(0, r.savings)), N, money(Math.max(0, r.savings) * N)); }, 700);
  for (const k of ['extraction', 'unclog']) {
    const inp = $(`[data-money="${k}"]`);
    inp.placeholder = num(Math.round(CONFIG.costCop[k] / rate()));
    if (document.activeElement !== inp) inp.value = S[k] == null ? '' : num(Math.round(S[k] / rate()));
  }
  $$('[data-cur]').forEach(el => { el.textContent = S.cur; });
}
function applyLang() {
  root.lang = S.lang;
  $$('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.i18nAria)));
  $$('.bc-tip').forEach(b => b.setAttribute('aria-label', tr('tipAria')));
  const t = CONFIG.ctaText[S.lang];
  out.cta.href = CONFIG.ctaUrl + (t && /wa\.me/.test(CONFIG.ctaUrl) ? (CONFIG.ctaUrl.includes('?') ? '&' : '?') + 'text=' + encodeURIComponent(t) : '');
  syncRanges();
}
function ripple() { for (const v of [vWithout, vWith]) v.kick(0.5, v.w / 2); line.Ek = Math.max(line.Ek, 0.5); }
function play(replay) {
  if (STATIC) { root.classList.add('is-landed'); return settle(); }
  const d = replay ? 0.5 : 0, t0 = 0.2 + rnd(0, 0.04);
  vWithout.play(t0, rnd(1.45, 1.7), d, 0);
  vWith.play(t0 + rnd(0.08, 0.16), rnd(1.45, 1.7), d, 1.05); // the saved water pours in once the cost liquid is ~70 % up
  line.play(1.5, d);
  setTimeout(() => root.classList.add('is-landed'), (d + 2.3) * 1000);
  loop.wake();
}

// inputs
const people = $('#bch-people'), years = $('#bch-years');
people.max = CONFIG.limits.peopleMax; years.max = CONFIG.limits.yearsMax;
people.value = S.people; years.value = S.years;
function syncRanges() {
  for (const el of [people, years]) el.style.setProperty('--p', ((el.value - el.min) / (el.max - el.min)) * 100 + '%');
  $('#bch-people-out').textContent = S.people;
  $('#bch-years-out').textContent = tr('yearsOut')(S.years);
}
people.addEventListener('input', () => { S.people = clamp(Math.round(+people.value) || 1, 1, CONFIG.limits.peopleMax); syncRanges(); update(); });
years.addEventListener('input', () => { S.years = clamp(Math.round(+years.value) || 0, 0, CONFIG.limits.yearsMax); syncRanges(); update(); });
for (const name of ['system', 'problems']) {
  $$(`[name="bch-${name}"]`).forEach(el => { el.checked = el.value === S[name]; el.addEventListener('change', () => { S[name] = el.value; update(); }); });
}
$$('[data-money]').forEach(inp => {
  const k = inp.dataset.money, hint = $(`[data-hint="${k}"]`);
  inp.addEventListener('input', () => {
    const v = parseMoney(inp.value), max = CONFIG.limits.moneyMaxCop;
    S[k] = v == null ? null : Math.min(v * rate(), max);
    hint.textContent = v != null && v * rate() > max ? tr('max')(money(max)) : v == null ? tr('ref')(money(CONFIG.costCop[k])) : '';
    update();
  });
  inp.addEventListener('blur', () => renderText());
});
for (const name of ['lang', 'cur']) {
  $$(`[name="bch-${name}"]`).forEach(el => {
    el.checked = el.value === S[name];
    el.addEventListener('change', () => { S[name] = el.value; $$('[data-hint]').forEach(h => { h.textContent = ''; }); applyLang(); renderText(); ripple(); if (STATIC) settle(); else loop.wake(); });
  });
}
root.querySelector('form').addEventListener('submit', e => e.preventDefault());
$('[data-act="replay"]').addEventListener('click', () => { if (played) play(true); });

// field tooltips (hover, focus or tap)
const tipbox = $('#bch-tipbox');
let tipOwner = null;
const tipShow = b => {
  tipOwner = b; tipbox.textContent = tr(b.dataset.tip); b.setAttribute('aria-describedby', tipbox.id);
  const r = b.getBoundingClientRect(), w = tipbox.offsetWidth;
  tipbox.style.left = clamp(r.left + r.width / 2 - w / 2, 16, window.innerWidth - w - 16) + 'px';
  tipbox.style.top = r.bottom + 8 + 'px'; tipbox.classList.add('is-on');
};
const tipHide = () => { if (tipOwner) tipOwner.removeAttribute('aria-describedby'); tipOwner = null; tipbox.classList.remove('is-on'); };
$$('.bc-tip').forEach(b => {
  b.addEventListener('mouseenter', () => tipShow(b)); b.addEventListener('mouseleave', tipHide);
  b.addEventListener('focus', () => tipShow(b)); b.addEventListener('blur', tipHide);
  b.addEventListener('click', () => (tipOwner === b && tipbox.classList.contains('is-on') ? tipHide() : tipShow(b)));
});
root.addEventListener('keydown', e => { if (e.key === 'Escape') tipHide(); });
window.addEventListener('scroll', tipHide, { passive: true });

root.classList.add('bc-js');
if (STATIC) root.classList.add('bc-static');
applyLang();
update();
const start = () => { if (!played) { played = true; play(false); } };
if (window.IntersectionObserver) {
  const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); start(); } }, { threshold: 0.2 });
  io.observe($('.bc-results'));
} else start();
if (window.ResizeObserver) new ResizeObserver(() => { if (STATIC) loop.drawStatic(); else loop.wake(); }).observe(root);
else window.addEventListener('resize', () => (STATIC ? loop.drawStatic() : loop.wake()));
})();
</script>
</div>
